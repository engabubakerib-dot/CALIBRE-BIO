[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calibre-bio"
version = "0.1.0"
description = "CALIBRE-Bio: a calibrated, constraint-aware epistemic firewall for LLM outputs in the life sciences"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
]

[project.optional-dependencies]
chem = ["rdkit>=2024.3"]
dev = ["pytest>=8.0", "ruff>=0.5"]
analysis = ["pandas>=2.2", "scipy>=1.13", "matplotlib>=3.8", "jupyterlab>=4.2"]
local-models = ["vllm>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
